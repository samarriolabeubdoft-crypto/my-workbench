<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的工作台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --blue-1: #83B7E1;
    --blue-2: #A5CCEA;
    --blue-3: #C8E3F5;
    --blue-4: #E5F1FB;
    --blue-deep: #3c648c;
    --yellow-1: #FCE76E;
    --yellow-2: #FFF3B0;
    --yellow-3: #FFF9DC;
    --cream: #FFF5E7;
    --bg: #ffffff;
    --paper: #FFFDF8;
    --card: #ffffff;
    --ink: #3a3330;
    --muted: #a09890;
    --line: #f0e8dc;
    --shadow: 0 6px 20px rgba(131,183,225,0.10);
    --shadow-lg: 0 16px 50px rgba(131,183,225,0.18);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(131,183,225,0.12) 0, transparent 38%),
      radial-gradient(circle at 88% 78%, rgba(252,231,110,0.16) 0, transparent 38%),
      radial-gradient(circle at 50% 50%, rgba(200,227,245,0.22) 0, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  /* 登录 */
  .login-mask {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #83B7E1 0%, #C8E3F5 50%, #FCE76E 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-box {
    background: #fff; border-radius: 24px; padding: 32px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(60,100,150,0.25);
  }
  .login-box h1 { margin: 0 0 6px; font-size: 22px; font-weight: 900; color: var(--blue-deep); }
  .login-sub { margin: 0 0 20px; font-size: 12px; color: var(--muted); }
  .login-box label {
    display: block; font-size: 11px; color: var(--muted);
    margin: 10px 0 4px; font-weight: 700;
  }
  .login-box input {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 2px solid var(--line); font-size: 14px;
    background: var(--paper); font-family: inherit;
  }
  .login-actions { display: flex; gap: 8px; margin-top: 18px; }
  .login-actions .btn { flex: 1; padding: 10px; }
  .login-tip {
    margin-top: 12px; font-size: 12px; text-align: center;
    min-height: 18px; color: var(--muted);
  }
  .login-anon { margin-top: 16px; text-align: center; }

  /* 应用外壳 */
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  .workbench-header {
    position: relative; margin: 16px 20px 0;
    border-radius: 20px; overflow: hidden;
    height: 120px; background: var(--blue-3);
    box-shadow: var(--shadow); border: 2px solid var(--line);
  }
  .workbench-header .slides {
    position: absolute; inset: 0; display: flex;
    transition: transform .6s ease;
  }
  .workbench-header .slide {
    min-width: 100%; height: 100%;
    background-size: cover; background-position: center;
  }
  .workbench-header .slide::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(131,183,225,0.35) 100%);
  }
  .workbench-title-wrap { position: absolute; left: 20px; bottom: 14px; z-index: 2; }
  .workbench-title {
    font-size: 22px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 10px rgba(60,100,150,0.45);
    background: transparent; border: none; outline: none;
    padding: 2px 6px; border-radius: 8px; min-width: 60px; font-family: inherit;
  }
  .workbench-title:focus { background: rgba(255,255,255,0.25); }
  .workbench-header .header-actions {
    position: absolute; right: 16px; top: 12px;
    display: flex; gap: 8px; z-index: 2;
  }
  .workbench-header .header-actions button {
    padding: 5px 12px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.85); color: var(--blue-deep);
    font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .workbench-header .header-actions button:hover { background: var(--yellow-1); color: var(--ink); }
  .workbench-header .dots {
    position: absolute; right: 20px; bottom: 14px;
    display: flex; gap: 6px; z-index: 2;
  }
  .workbench-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.6); cursor: pointer;
  }
  .workbench-header .dot.active { background: var(--yellow-1); }
  .sync-status {
    position: absolute; left: 20px; top: 14px;
    background: rgba(255,255,255,0.85); color: var(--blue-deep);
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    font-weight: 700; z-index: 2;
  }

  .main-layout {
    flex: 1; display: flex; gap: 20px;
    padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%;
  }

  /* 左侧导航 - 仅大屏 */
  .side-nav {
    width: 200px; flex-shrink: 0;
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 2px solid var(--line);
    padding: 18px 12px; display: flex; flex-direction: column;
    height: fit-content; position: sticky; top: 20px;
  }
  .side-nav .nav-title {
    font-size: 11px; color: var(--muted); font-weight: 700;
    padding: 0 12px 10px; letter-spacing: 1px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    color: var(--ink); transition: all .15s;
  }
  .nav-item:hover { background: rgba(200,227,245,0.4); }
  .nav-item.active {
    background: var(--blue-1); color: #fff;
    box-shadow: 0 4px 12px rgba(131,183,225,0.4);
  }
  .nav-item .nav-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--blue-1); flex-shrink: 0;
  }
  .nav-item.active .nav-dot { background: var(--yellow-1); }
  .nav-spacer { flex: 1; min-height: 20px; }

  .content { flex: 1; min-width: 0; }
  .view { display: none; }
  .view.active { display: block; }

  /* 底部 Tab - 仅手机 */
  .mobile-tabs {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 2px solid var(--line);
    padding: 8px 10px; z-index: 100;
    justify-content: space-around;
    box-shadow: 0 -4px 20px rgba(131,183,225,0.15);
  }
  .mobile-tabs .tab {
    padding: 8px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink);
  }
  .mobile-tabs .tab.active { background: var(--blue-1); color: #fff; }

  /* 卡片 */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
    border: 2px solid var(--line); position: relative; overflow: hidden;
  }
  .card::after {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--blue-3); opacity: .35; pointer-events: none;
  }
  .card h2 {
    font-size: 15px; margin: 0 0 14px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; font-weight: 800;
  }
  .card h2 .title-wrap { display: flex; align-items: center; gap: 8px; }
  .card h2 .title-wrap::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--blue-1);
  }

  .btn {
    padding: 7px 16px; border-radius: 999px; border: none;
    background: var(--blue-1); color: #fff; cursor: pointer;
    font-size: 12px; font-weight: 700; transition: all .15s;
  }
  .btn:hover { transform: translateY(-1px); background: #6ba6d5; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .btn.ghost:hover { border-color: var(--blue-1); color: var(--blue-1); }
  .btn.small { padding: 4px 10px; font-size: 11px; }
  .btn.active { background: var(--yellow-1); color: var(--ink); border-color: var(--yellow-1); }

  /* 布局 */
  .today-top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  .calendar-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .overview-grid .full { grid-column: 1 / -1; }

  /* 时间轴 */
  .timeline-block { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .timeline-col {
    position: relative; background: var(--paper);
    border: 2px solid var(--line); border-radius: 16px;
    padding: 12px; min-height: 420px;
  }
  .timeline-col h3 {
    font-size: 13px; font-weight: 800; margin: 0 0 10px; color: var(--blue-deep);
  }
  .timeline-hour-lines { position: relative; padding-left: 48px; }
  .timeline-hour-line {
    height: 28px; border-bottom: 1px dashed var(--line); position: relative;
  }
  .timeline-hour-line::before {
    content: attr(data-hour);
    position: absolute; left: -44px; top: 0;
    width: 40px; text-align: right;
    font-size: 10px; color: var(--muted); font-weight: 700;
  }
  .timeline-event {
    position: absolute; left: 48px; right: 8px;
    border-radius: 8px; padding: 4px 8px;
    font-size: 11px; font-weight: 700;
    overflow: hidden; cursor: pointer; z-index: 2;
    border-left: 3px solid;
  }

  .ring-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-wrap .ring-bg { fill: none; stroke: rgba(131,183,225,0.15); stroke-width: 5; }
  .ring-wrap .ring-fg { fill: none; stroke-width: 5; stroke-linecap: round; }
  .ring-wrap .ring-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: var(--blue-deep);
  }

  /* 任务进度行 */
  .task-progress-line {
    padding: 12px 14px; border-radius: 14px;
    background: var(--paper); border: 2px solid var(--line);
    margin-bottom: 10px; border-left: 5px solid var(--blue-1);
  }
  .task-progress-line .tpl-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .task-progress-line .tpl-name {
    flex: 1; font-size: 13px; font-weight: 700; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-progress-line .tpl-name:hover { color: var(--blue-1); }
  .task-progress-line .tpl-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700;
  }
  .task-progress-line .tpl-badge.over { background: rgba(252,231,110,0.5); color: #6b5a1a; }
  .task-progress-line .tpl-badge.done { background: rgba(131,183,225,0.25); color: var(--blue-deep); }
  .task-progress-line .tpl-badge.partial { background: rgba(255,235,238,0.8); color: #c62828; }
  .task-progress-line .tpl-badge.none { background: #ffebee; color: #c62828; }
  .task-progress-line .tpl-meta {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 6px;
  }
  .task-progress-line .tpl-bar {
    height: 8px; background: rgba(131,183,225,0.15);
    border-radius: 999px; overflow: hidden;
  }
  .task-progress-line .tpl-bar-fill {
    height: 100%; border-radius: 999px; transition: width .3s;
  }
  .task-progress-line .tpl-bottom {
    display: flex; justify-content: space-between;
    font-size: 11px; margin-top: 4px;
  }

  /* 任务树 */
  .category-block { margin-bottom: 22px; }
  .category-title {
    font-size: 14px; font-weight: 800;
    padding: 6px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tree { list-style: none; padding-left: 0; margin: 0; }
  .tree li { margin: 8px 0; }
  .task-node {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    background: var(--paper); border: 2px solid var(--line);
    flex-wrap: wrap; transition: all .15s;
  }
  .task-node:hover { border-color: rgba(131,183,225,0.4); }
  .task-node .toggle {
    cursor: pointer; width: 16px; text-align: center;
    color: var(--muted); user-select: none; font-weight: 700;
    flex-shrink: 0; margin-top: 4px; transition: transform .2s;
  }
  .task-node .toggle.collapsed { transform: rotate(-90deg); }
  .task-node .title { flex: 1; font-size: 14px; font-weight: 700; min-width: 100px; cursor: pointer; }
  .task-node.done .title { text-decoration: line-through; color: var(--muted); }
  .task-node .body { flex: 1; min-width: 200px; }
  .task-timeline {
    position: relative; height: 22px; margin-top: 8px;
    background: rgba(200,227,245,0.5); border-radius: 999px;
    overflow: hidden; cursor: pointer; user-select: none;
  }
  .task-timeline .bar {
    position: absolute; top: 0; bottom: 0; border-radius: 999px;
  }
  .task-timeline .hour-mark {
    position: absolute; top: 0; bottom: 0;
    width: 1px; background: rgba(255,255,255,0.7);
  }
  .task-timeline .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--blue-deep);
  }
  .task-detail-text {
    font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5;
  }
  .tag {
    font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700;
  }
  .tag.today { background: rgba(131,183,225,0.2); color: var(--blue-deep); }
  .tag['3d'] { background: rgba(252,231,110,0.35); color: #6b5a1a; }
  .tag['7d'] { background: rgba(200,227,245,0.6); color: var(--blue-deep); }
  .tag.longterm { background: rgba(252,231,110,0.35); color: #6b5a1a; }
  .drag-progress {
    position: relative; width: 110px; height: 20px;
    display: flex; align-items: center; cursor: pointer; user-select: none;
  }
  .drag-progress .track {
    width: 100%; height: 8px; background: rgba(131,183,225,0.15);
    border-radius: 999px; overflow: hidden; position: relative;
  }
  .drag-progress .fill {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
  }
  .drag-progress .thumb {
    position: absolute; top: 50%; width: 16px; height: 16px;
    background: #fff; border: 2px solid var(--blue-1); border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .drag-progress .value {
    position: absolute; right: -40px; font-size: 11px;
    color: var(--muted); font-weight: 700; min-width: 34px;
  }
  .children { margin-left: 24px; border-left: 2px dashed var(--line); padding-left: 12px; }
  .children.hidden { display: none; }
  .done-section { margin-top: 26px; border-top: 2px dashed var(--line); padding-top: 18px; }
  .done-section h3 {
    font-size: 14px; font-weight: 800; margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .done-section h3::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow-1);
  }
  .done-item {
    padding: 14px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--paper);
    margin-bottom: 10px; cursor: pointer; transition: all .15s;
  }
  .done-item:hover { border-color: var(--blue-1); }
  .done-item .done-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .done-item .done-title {
    font-size: 13px; font-weight: 700; text-decoration: line-through;
    color: var(--muted); flex: 1;
  }
  .done-item .done-time { font-size: 11px; color: var(--muted); }
  .done-item .done-detail { font-size: 12px; color: var(--ink); margin-top: 4px; opacity: .85; }

  /* 长期打卡 - 重做对齐 */
  .habit-summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: linear-gradient(135deg, rgba(131,183,225,0.9), rgba(200,227,245,0.9));
    color: var(--blue-deep); padding: 16px; border-radius: 18px; margin-bottom: 18px;
  }
  .habit-summary .item { text-align: center; }
  .habit-summary .item .num { font-size: 22px; font-weight: 900; color: var(--blue-deep); }
  .habit-summary .item .label { font-size: 11px; color: #5a7a99; margin-top: 2px; }

  .habit-week-table {
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 16px; overflow: hidden;
  }
  .habit-week-header, .habit-week-row {
    display: grid;
    grid-template-columns: 1.6fr repeat(7, 1fr);
    align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line);
    gap: 4px;
  }
  .habit-week-header {
    background: rgba(200,227,245,0.5);
    font-weight: 800; font-size: 12px; color: var(--blue-deep);
  }
  .habit-week-header > div { text-align: center; }
  .habit-week-header > div:first-child { text-align: left; }
  .habit-week-row:last-child { border-bottom: none; }
  .habit-week-row .habit-name-cell {
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700;
  }
  .habit-week-row .habit-icon {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
    flex-shrink: 0; background-size: cover; background-position: center;
  }
  .habit-week-row > .habit-check { justify-self: center; }
  .habit-check {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(200,227,245,0.4);
    border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; color: transparent;
    transition: all .15s;
  }
  .habit-check.done { background: var(--yellow-1); border-color: var(--yellow-1); color: var(--blue-deep); }
  .habit-check.today { outline: 2px solid var(--blue-1); }

  /* 今日总结 */
  .today-rate-box {
    display: flex; align-items: center; gap: 20px;
    padding: 20px; background: var(--paper);
    border: 2px solid var(--line); border-radius: 18px;
  }
  .today-rate-box .big-num {
    font-size: 44px; font-weight: 900; color: var(--blue-1);
    line-height: 1; letter-spacing: -1px;
  }
  .today-rate-box .info { flex: 1; }
  .today-rate-box .info .line1 { font-size: 14px; font-weight: 800; }
  .today-rate-box .info .line2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .today-rate-box .info .mood {
    margin-top: 8px; font-size: 12px; font-weight: 700;
    padding: 6px 10px; border-radius: 10px;
    background: rgba(252,231,110,0.35); color: #6b5a1a; display: inline-block;
  }
  .delta-up { color: #3c648c; font-weight: 800; }
  .delta-down { color: #c62828; font-weight: 800; }

  /* 日历 - 通用 */
  .cal-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .cal-toolbar .nav { display: flex; gap: 8px; align-items: center; }
  .cal-toolbar .title { font-size: 15px; font-weight: 900; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px;
  }
  .cal-weekdays div {
    text-align: center; font-size: 11px; color: var(--muted);
    padding: 4px 0; font-weight: 700;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-cell {
    min-height: 112px; border: 2px solid var(--line);
    border-radius: 14px; padding: 8px; background: var(--paper);
    cursor: pointer; display: flex; flex-direction: column;
    gap: 4px; overflow: hidden;
  }
  .cal-cell.other-month { opacity: 0.35; }
  .cal-cell.today { border: 2px solid var(--blue-1); background: rgba(200,227,245,0.25); }
  .cal-cell.selected { background: rgba(252,231,110,0.25); border-color: var(--yellow-1); }
  .cal-day {
    font-size: 13px; font-weight: 900;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cal-day .rate { font-size: 10px; color: var(--muted); font-weight: 700; }
  .cal-tasks { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow: hidden; }
  .cal-task {
    font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--blue-deep);
  }
  .cal-task.done { text-decoration: line-through; }
  .cal-more { font-size: 10px; color: var(--muted); text-align: center; }

  /* 手机专用日历（周视图 + 时间轴列表） */
  .mobile-calendar-wrap { display: none; }
  .mc-week-bar {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 12px;
  }
  .mc-day-cell {
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 12px; padding: 8px 4px; text-align: center;
    cursor: pointer; transition: all .15s;
  }
  .mc-day-cell .mc-week-label { font-size: 10px; color: var(--muted); font-weight: 700; }
  .mc-day-cell .mc-day-num {
    font-size: 18px; font-weight: 900; color: var(--ink);
    line-height: 1.2;
  }
  .mc-day-cell .mc-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue-1); margin: 3px auto 0;
    opacity: 0;
  }
  .mc-day-cell.has-task .mc-dot { opacity: 1; }
  .mc-day-cell.today { border-color: var(--blue-1); background: rgba(200,227,245,0.35); }
  .mc-day-cell.selected { border-color: var(--yellow-1); background: rgba(252,231,110,0.35); }

  .mc-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .mc-header .mc-title { font-size: 14px; font-weight: 800; color: var(--blue-deep); }

  .mc-all-day {
    background: rgba(252,231,110,0.25);
    border: 2px solid rgba(252,231,110,0.6);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  }
  .mc-all-day .mc-al-title {
    font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px;
  }
  .mc-al-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px;
    background: #fff; font-size: 12px; font-weight: 700;
    margin-bottom: 4px;
  }
  .mc-al-item .mc-check {
    width: 16px; height: 16px; border-radius: 4px;
    background: var(--yellow-1); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }

  .mc-timeline {
    display: flex; flex-direction: column; gap: 6px;
  }
  .mc-timeline-item {
    display: flex; gap: 10px; align-items: stretch;
  }
  .mc-time-label {
    width: 48px; flex-shrink: 0;
    font-size: 10px; color: var(--muted); font-weight: 700;
    padding-top: 6px;
  }
  .mc-task-block {
    flex: 1; border-radius: 10px; padding: 8px 12px;
    font-size: 12px; font-weight: 700;
    border-left: 4px solid;
    cursor: pointer;
  }
  .mc-task-block .mc-task-title { font-size: 12px; font-weight: 800; margin-bottom: 2px; }
  .mc-task-block .mc-task-time { font-size: 10px; opacity: .8; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(80,60,50,0.35);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 22px; padding: 22px;
    width: 100%; max-width: 580px; max-height: 90vh;
    overflow: auto; box-shadow: var(--shadow-lg);
    border: 2px solid var(--line);
  }
  .modal h3 { margin: 0 0 12px; font-size: 15px; font-weight: 900; }
  .modal label {
    display: block; font-size: 11px; color: var(--muted);
    margin: 10px 0 4px; font-weight: 700;
  }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 9px 12px; border-radius: 12px;
    border: 2px solid var(--line); font-size: 13px; font-family: inherit;
    background: var(--paper);
  }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .time-range-picker {
    background: var(--paper); border: 2px solid var(--line);
    border-radius: 14px; padding: 12px; margin-top: 6px;
  }
  .time-range-bar {
    position: relative; height: 32px;
    background: rgba(200,227,245,0.5);
    border-radius: 999px; margin: 8px 0;
    cursor: crosshair; user-select: none;
  }
  .time-range-bar .selection {
    position: absolute; top: 0; bottom: 0;
    background: rgba(131,183,225,0.7); border-radius: 999px;
  }
  .time-range-bar .handle {
    position: absolute; top: 50%;
    width: 16px; height: 16px; background: #fff;
    border: 2px solid var(--blue-1); border-radius: 50%;
    transform: translate(-50%, -50%); cursor: ew-resize; z-index: 2;
  }
  .time-range-bar .hour-tick {
    position: absolute; top: 0; bottom: 0;
    width: 1px; background: rgba(255,255,255,0.7);
  }
  .time-range-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); font-weight: 700;
  }
  .time-range-info {
    font-size: 12px; font-weight: 700; color: var(--blue-deep); margin-top: 6px;
  }

  .img-preview {
    position: fixed; inset: 0; background: rgba(30,20,15,0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 1100; padding: 20px;
  }
  .img-preview.show { display: flex; }
  .img-preview img, .img-preview video { max-width: 100%; max-height: 90vh; border-radius: 12px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .thumb {
    width: 56px; height: 56px; object-fit: cover;
    border-radius: 12px; border: 2px solid var(--line); cursor: pointer;
  }
  .log {
    font-size: 12px; padding: 10px 0;
    border-bottom: 1px dashed var(--line); color: var(--muted);
  }
  .log b { color: var(--ink); }
  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--blue-deep); color: #fff; padding: 14px 24px;
    border-radius: 999px; font-size: 13px; opacity: 0;
    transition: all .4s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; max-width: 90vw; text-align: center;
    font-weight: 700; box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .celebrate {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 1200; display: none; align-items: center; justify-content: center;
  }
  .celebrate.show { display: flex; }
  .celebrate .circle {
    width: 170px; height: 170px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    animation: pop 1.2s ease; background: var(--yellow-1);
  }
  .celebrate .circle::after {
    content: '✓'; font-size: 96px; color: var(--blue-deep); font-weight: 900;
  }
  @keyframes pop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 0; }
  }
  .confetti {
    position: fixed; width: 10px; height: 10px; z-index: 1201;
    pointer-events: none; border-radius: 2px;
    animation: fall 1.5s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  .empty {
    color: var(--muted); font-size: 12px;
    text-align: center; padding: 22px 0;
  }

  /* 总览右侧竖列（大屏专用） */
  .overview-right-col {
    display: flex; flex-direction: column; gap: 18px;
  }
  .overview-right-col .card { margin-bottom: 0; }

  /* 今日自适应（大屏） */
  .today-top-adaptive {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 1000px) {
    /* 手机 */
    .side-nav { display: none; }
    .main-layout { padding: 12px; gap: 0; }
    .mobile-tabs { display: flex; }
    .app { padding-bottom: 70px; }
    .workbench-header { height: 110px; margin: 12px 12px 0; }
    .workbench-title { font-size: 18px; }
    .today-top, .calendar-layout, .overview-grid, .today-top-adaptive { grid-template-columns: 1fr; }
    .timeline-block { grid-template-columns: 1fr; }
    .cal-cell { min-height: 84px; padding: 5px; }
    .drag-progress { width: 80px; }
    .drag-progress .value { right: -34px; font-size: 10px; }

    /* 手机：隐藏总览 */
    .mobile-tabs .tab[data-view="all"] { display: none; }

    /* 手机：日历改成 mc 样式，隐藏桌面日历 */
    .desktop-calendar-wrap { display: none; }
    .mobile-calendar-wrap { display: block; }

    /* 手机：日历 view 里只显示 mc 部分 */
    #view-calendar .calendar-layout { display: block; }
    #view-calendar .day-detail { display: none; }

    /* 手机：打卡表更紧凑 */
    .habit-week-header, .habit-week-row {
      padding: 8px 10px; gap: 2px;
      grid-template-columns: 1.4fr repeat(7, 1fr);
    }
    .habit-week-row .habit-icon { width: 26px; height: 26px; font-size: 11px; }
    .habit-week-row .habit-name-cell span { font-size: 12px; }
    .habit-check { width: 24px; height: 24px; font-size: 12px; border-radius: 6px; }
  }
  @media (min-width: 1001px) {
    .mobile-tabs { display: none; }
    .app { padding-bottom: 40px; }
    .mobile-calendar-wrap { display: none; }
    .desktop-calendar-wrap { display: block; }
  }
  @media (min-width: 1400px) {
    .main-layout { max-width: 1600px; }
    .overview-grid { grid-template-columns: 1fr 1fr 1fr; }
    .overview-grid .full { grid-column: 1 / -1; }
    .today-top-adaptive { grid-template-columns: 1.2fr 1fr; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-mask" id="loginMask">
  <div class="login-box">
    <h1>我的工作台</h1>
    <p class="login-sub">登录后数据云端同步，多端互通</p>
    <label>邮箱</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" />
    <label>密码</label>
    <input type="password" id="loginPassword" placeholder="至少 6 位" />
    <div class="login-actions">
      <button class="btn" onclick="doLogin()">登录</button>
      <button class="btn ghost" onclick="doSignup()">注册</button>
    </div>
    <div class="login-tip" id="loginTip"></div>
    <div class="login-anon">
      <button class="btn ghost small" onclick="useLocalMode()">先本地使用（不同步）</button>
    </div>
  </div>
</div>

<!-- 应用 -->
<div class="app" id="app" style="display:none;">

  <div class="workbench-header">
    <div class="slides" id="slides"></div>
    <div class="workbench-title-wrap">
      <input class="workbench-title" id="workbenchTitle" value="我的工作台" />
    </div>
    <div class="header-actions">
      <button onclick="openTaskModal()" style="background:var(--yellow-1);color:var(--ink);font-weight:800;">+ 新任务</button>
      <button onclick="document.getElementById('bannerUpload').click()">上传轮播图</button>
      <button onclick="removeBannerImage()">删除当前</button>
    </div>
    <div class="dots" id="bannerDots"></div>
    <input type="file" id="bannerUpload" accept="image/*" style="display:none" />
    <div class="sync-status" id="syncStatus">未登录</div>
  </div>

  <div class="main-layout">

    <nav class="side-nav" id="sideNav">
      <div class="nav-title">导航</div>
      <div class="nav-item active" data-view="all" onclick="switchView('all')">
        <span class="nav-dot"></span><span>总览</span>
      </div>
      <div class="nav-item" data-view="today" onclick="switchView('today')">
        <span class="nav-dot"></span><span>今日</span>
      </div>
      <div class="nav-item" data-view="tree" onclick="switchView('tree')">
        <span class="nav-dot"></span><span>任务树</span>
      </div>
      <div class="nav-item" data-view="habits" onclick="switchView('habits')">
        <span class="nav-dot"></span><span>长期打卡</span>
      </div>
      <div class="nav-item" data-view="calendar" onclick="switchView('calendar')">
        <span class="nav-dot"></span><span>日历</span>
      </div>
      <div class="nav-item" data-view="logs" onclick="switchView('logs')">
        <span class="nav-dot"></span><span>留痕</span>
      </div>
      <div class="nav-spacer"></div>
      <div class="nav-item" onclick="doLogout()">
        <span class="nav-dot" style="background:#e07b6f"></span><span>退出登录</span>
      </div>
    </nav>

    <main class="content">

      <!-- 总览 -->
      <section class="view active" id="view-all">
        <div class="overview-grid">
          <div class="card">
            <h2><span class="title-wrap">今日重点</span></h2>
            <div id="ovFocus"></div>
          </div>
          <div class="card">
            <h2><span class="title-wrap">今日总结</span></h2>
            <div id="ovRate"></div>
          </div>
          <div class="card full">
            <h2><span class="title-wrap">24 小时时间轴</span></h2>
            <div class="timeline-block" id="ovTimeline"></div>
          </div>
          <div class="card full">
            <h2><span class="title-wrap">日历</span></h2>
            <div class="cal-grid" id="ovCal"></div>
          </div>
          <div class="card">
            <h2><span class="title-wrap">任务数</span></h2>
            <div id="ovStats"></div>
          </div>
          <div class="card">
            <h2><span class="title-wrap">长期打卡</span></h2>
            <div id="ovHabits"></div>
          </div>
        </div>
      </section>

      <!-- 今日 -->
      <section class="view" id="view-today">
        <div class="today-top-adaptive">
          <div class="card">
            <h2><span class="title-wrap">今日重点</span></h2>
            <div id="focus"></div>
          </div>
          <div class="card">
            <h2><span class="title-wrap">今日总结</span></h2>
            <div id="todayRateBox"></div>
            <h2 style="margin-top:16px;"><span class="title-wrap">今日任务明细</span></h2>
            <div id="todayTaskList"></div>
            <h2 style="margin-top:16px;"><span class="title-wrap">今日建议</span></h2>
            <div id="suggestions"></div>
          </div>
        </div>
        <div class="card">
          <h2><span class="title-wrap">24 小时时间轴</span></h2>
          <div class="timeline-block" id="timelineBlock"></div>
        </div>
      </section>

      <!-- 任务树 -->
      <section class="view" id="view-tree">
        <div class="card">
          <h2>
            <span class="title-wrap">任务树（按分类）</span>
            <span>
              <button class="btn ghost small" onclick="expandAllTree()">展开全部</button>
              <button class="btn ghost small" onclick="collapseAllTree()">折叠全部</button>
            </span>
          </h2>
          <div id="treeByCategory"></div>
          <div class="done-section">
            <h3>已完成任务</h3>
            <div id="doneList"></div>
          </div>
        </div>
      </section>

      <!-- 长期打卡 -->
      <section class="view" id="view-habits">
        <div class="card">
          <h2>
            <span class="title-wrap">长期打卡</span>
            <span>
              <button class="btn ghost small" onclick="openHabitModal()">+ 新打卡</button>
              <button class="btn ghost small" onclick="exportHabits()">导出</button>
            </span>
          </h2>
          <div id="habitSummary"></div>
          <div id="habitWeekTable"></div>
        </div>
      </section>

      <!-- 日历 -->
      <section class="view" id="view-calendar">
        <div class="card" style="padding:14px 18px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;" id="homeStats"></div>
        </div>

        <!-- 电脑 / 平板日历 -->
        <div class="desktop-calendar-wrap">
          <div class="calendar-layout">
            <div class="card">
              <div class="cal-toolbar">
                <div class="nav">
                  <button class="btn ghost" onclick="calPrev()">‹</button>
                  <span class="title" id="calTitle"></span>
                  <button class="btn ghost" onclick="calNext()">›</button>
                  <button class="btn ghost" onclick="calToday()">今天</button>
                </div>
                <div class="nav">
                  <button class="btn ghost" id="calModeMonth" onclick="setCalMode('month')">月</button>
                  <button class="btn ghost" id="calModeWeek" onclick="setCalMode('week')">周</button>
                  <button class="btn ghost" id="calModeDay" onclick="setCalMode('day')">日</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
              </div>
              <div class="cal-grid" id="calGrid"></div>
            </div>
            <div class="card day-detail">
              <h2><span class="title-wrap" id="detailTitle">当天详情</span></h2>
              <div id="dayDetail"></div>
            </div>
          </div>
        </div>

        <!-- 手机日历：周视图 + 时间轴列表 -->
        <div class="mobile-calendar-wrap">
          <div class="card">
            <div class="mc-header">
              <div class="mc-title" id="mcMonthTitle"></div>
              <div class="nav" style="display:flex;gap:6px;">
                <button class="btn ghost small" onclick="mcPrevWeek()">‹</button>
                <button class="btn ghost small" onclick="mcToday()">今天</button>
                <button class="btn ghost small" onclick="mcNextWeek()">›</button>
              </div>
            </div>
            <div class="mc-week-bar" id="mcWeekBar"></div>
          </div>
          <div class="card" id="mcDetailCard">
            <div class="mc-header">
              <div class="mc-title" id="mcDayTitle"></div>
            </div>
            <div id="mcAllDay"></div>
            <div class="mc-timeline" id="mcTimeline"></div>
          </div>
        </div>

      </section>

      <!-- 留痕 -->
      <section class="view" id="view-logs">
        <div class="card">
          <h2><span class="title-wrap">留痕记录</span></h2>
          <div id="logs"></div>
        </div>
      </section>

    </main>
  </div>

  <div class="mobile-tabs">
    <div class="tab" data-view="today" onclick="switchView('today')">今日</div>
    <div class="tab" data-view="tree" onclick="switchView('tree')">任务树</div>
    <div class="tab" data-view="habits" onclick="switchView('habits')">打卡</div>
    <div class="tab active" data-view="calendar" onclick="switchView('calendar')">日历</div>
    <div class="tab" data-view="logs" onclick="switchView('logs')">留痕</div>
  </div>

</div>

<!-- 任务弹窗 -->
<div class="modal-mask" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">新建任务</h3>
    <label>任务名称</label>
    <input type="text" id="mTitle" />
    <label>分类</label>
    <select id="mCategory">
      <option value="life">生活</option>
      <option value="work" selected>工作</option>
      <option value="side">副业</option>
      <option value="fitness">健身</option>
      <option value="study">学习</option>
    </select>
    <label>父任务（可选）</label>
    <select id="mParent"><option value="">— 无 —</option></select>
    <label>完成时间类型</label>
    <select id="mTiming">
      <option value="today" selected>当天完成</option>
      <option value="3d">3 天内完成</option>
      <option value="7d">一周内完成</option>
      <option value="longterm">长期任务</option>
    </select>
    <div id="simpleDateWrap">
      <label>开始日期</label>
      <input type="date" id="mStartDate" />
      <label>周期类型</label>
      <select id="mRepeatSimple">
        <option value="none">不重复</option>
        <option value="daily">每天都要完成</option>
        <option value="weekday">仅工作日</option>
        <option value="weekday-holiday">工作日 + 节假日跳过</option>
      </select>
      <label>时间段（拖动选择起止）</label>
      <div class="time-range-picker" id="timeRangeSimple"></div>
      <label>分段（多个不连续时段，逗号隔开，如 7-9,14-15）</label>
      <input type="text" id="mSegments" placeholder="例如：7-9,14-15" />
      <label><input type="checkbox" id="mAutoRoll" style="width:auto;margin-right:6px;" checked />未完成自动顺延到次日同一时间段</label>
    </div>
    <div id="longTermWrap" style="display:none;">
      <label>开始日期</label>
      <input type="date" id="mPeriodStart" />
      <label>截止日期</label>
      <input type="date" id="mPeriodEnd" />
      <label>周期类型</label>
      <select id="mRepeatLong">
        <option value="daily">每天都要完成</option>
        <option value="weekday">仅工作日</option>
        <option value="weekday-holiday">工作日 + 节假日跳过</option>
        <option value="custom-days">自定义</option>
      </select>
      <label>总工时（小时）</label>
      <input type="number" id="mTotalHours" min="0" step="0.5" value="0" />
      <label>每日分配</label>
      <div id="dailyPlanWrap"></div>
      <label>时间段（拖动选择）</label>
      <div class="time-range-picker" id="timeRangeLong"></div>
      <label>分段</label>
      <input type="text" id="mSegmentsLong" placeholder="例如：7-9,14-15" />
      <label><input type="checkbox" id="mAutoRollLong" style="width:auto;margin-right:6px;" checked />未完成自动顺延到次日同一时间段</label>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;" id="mPeriodHint"></div>
    <label>当前进度（0-100）</label>
    <input type="number" id="mProgress" min="0" max="100" value="0" />
    <label>备注</label>
    <textarea id="mDetail"></textarea>
    <label>上传图片 / 视频</label>
    <input type="file" id="mFiles" accept="image/*,video/*" multiple />
    <div class="thumbs" id="mThumbs"></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeTaskModal()">取消</button>
      <button class="btn" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<!-- 进度弹窗 -->
<div class="modal-mask" id="progressModal">
  <div class="modal">

async function pullFromCloud() {

    const { data: rows, error } = await supabaseClient
      .from('workbench_data').select('data').eq('user_id', currentUser.id).maybeSingle();

        setSyncStatus('已同步', 'rgba(252,231,110,0.85)');

function ringSVG(progress, color, size) {

  const offset = c * (1 - Math.min(1, ratio));
  const over = progress > 100;
  const text = over ? `超额 ${Math.round(progress)}%` : `${Math.round(progress)}%`;
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}">
        <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
        <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
          stroke="${color || '#83B7E1'}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="ring-text">${text}</div>
    </div>
  `;
}

  const mode = task.repeatMode || task.repeat || 'none';
  if (mode === 'none') return dateStr === range.start;
  const start = range.start, end = range.end;
  if (start && dateStr < start) return false;
  if (end && dateStr > end) return false;
  const base = new Date((start || task.date) + 'T00:00:00');
  const cur = new Date(dateStr + 'T00:00:00');

    if (t.progress >= 100) return;
    if (t.status === 'done') return;
    const range = getTimingRange(t);
    const yest = getYesterdayStr();
    if (yest >= range.start && (range.end ? yest <= range.end : true)) {
      const snap = getTaskDaily(t.id, yest);
      const level = snap ? snap.finishLevel : null;
      const yesterdayDone = level === 'done' || level === 'over';
      if (!yesterdayDone) {
        if (!t.periodEnd) t.periodEnd = today;
        else if (t.periodEnd < today) t.periodEnd = today;

function calcPeriodInfo(mode, start, end) {
  if (!start || !end) return { days: 0, daily: 0 };
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  let days = 0;
  const cur = new Date(s);
  while (cur <= e) {
    const d = cur.getDay();
    if (mode === 'daily') days++;
    else if (mode === 'weekday') { if (d >= 1 && d <= 5) days++; }
    else if (mode === 'weekday-holiday') { if (d >= 1 && d <= 5) days++; }
    else if (mode === 'custom-days') days++;
    cur.setDate(cur.getDate() + 1);
  }

}

function renderTimeRangePicker(containerId, range, onChange) {

  const leftPct = (range.start / 24) * 100;
  const rightPct = (range.end / 24) * 100;
  el.innerHTML = `
    <div class="time-range-bar" id="${containerId}-bar">
      <div class="selection" style="left:${leftPct}%;width:${rightPct-leftPct}%"></div>
      <div class="handle" style="left:${leftPct}%" data-role="start"></div>
      <div class="handle" style="left:${rightPct}%" data-role="end"></div>

  `;

  const startHandle = bar.querySelector('[data-role="start"]');
  const endHandle = bar.querySelector('[data-role="end"]');
  const selection = bar.querySelector('.selection');
  let dragging = null;
  function getHourFromX(x) {
    const rect = bar.getBoundingClientRect();

  }
  function update() {
    const l = (range.start / 24) * 100;
    const r = (range.end / 24) * 100;
    selection.style.left = l + '%';
    selection.style.width = (r - l) + '%';
    startHandle.style.left = l + '%';
    endHandle.style.left = r + '%';
    el.querySelector('.time-range-info').textContent =
      `已选：${String(range.start).padStart(2,'0')}:00 - ${String(range.end).padStart(2,'0')}:00（${range.end - range.start} 小时）`;
  }
  function down(role) { return (e) => { dragging = role; e.preventDefault(); }; }

  endHandle.addEventListener('touchstart', down('end'), { passive: false });

  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);

/* ========== 打卡 ========== */
let editingHabitId = null;

function getWeekStart() {
  const now = new Date();
  const day = (now.getDay() + 6) % 7;
  const d = new Date(now);
  d.setDate(now.getDate() - day); d.setHours(0,0,0,0);
  return d;
}
function renderHabitSummary() {

    const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
    weekDays.push(formatDate(d));
  }
  let totalScore = 0;
  data.habits.forEach(h => {
    if (h.status !== 'doing') return;
    weekDays.forEach(ds => { if (h.checkinDone && h.checkinDone[ds]) totalScore += h.score || 3; });
  });

      <div class="item"><div class="num">${totalScore}</div><div class="label">周得分</div></div>

    h.checkinDone[dateStr] = true;

  };

function exportHabits() {

  data.habits.forEach(h => {
    const checkins = h.checkins || {};
    const dates = Object.keys(checkins).sort();
    const periodText = h.periodDays > 0 ? `${h.periodDays}天` : '';
    if (!dates.length) rows.push([h.name, h.status, h.start, periodText, h.score || 3, '', '']);
    else dates.forEach(d => rows.push([h.name, h.status, h.start, periodText, h.score || 3, d, '已完成']));

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function renderTimeline() {
  const el = document.getElementById('timelineBlock');
  if (!el) return;
  el.innerHTML = '';
  const today = todayStr();
  const tasks = getTasksOnDate(today);
  function buildCol(label, hourStart, hourEnd) {
    const col = document.createElement('div');
    col.className = 'timeline-col';
    col.innerHTML = `<h3>${label}（${String(hourStart).padStart(2,'0')}:00 - ${String(hourEnd).padStart(2,'0')}:00）</h3>`;
    const inner = document.createElement('div');
    inner.className = 'timeline-hour-lines';
    for (let h = hourStart; h <= hourEnd; h++) {
      const line = document.createElement('div');
      line.className = 'timeline-hour-line';
      line.dataset.hour = `${String(h).padStart(2,'0')}:00`;
      inner.appendChild(line);
    }
    tasks.forEach(t => {
      if (!t.timeRange) return;
      const ts = t.timeRange.start, te = t.timeRange.end;
      const s = Math.max(ts, hourStart);
      const e = Math.min(te, hourEnd);
      if (s >= e) return;
      const top = (s - hourStart) * 28;
      const height = (e - s) * 28 - 2;
      const c = colorForTask(t);
      const ev = document.createElement('div');
      ev.className = 'timeline-event';
      ev.style.top = top + 'px';
      ev.style.height = Math.max(22, height) + 'px';
      ev.style.background = c.bg;
      ev.style.color = c.text;
      ev.style.borderLeftColor = c.solid;
      ev.textContent = `${t.title} ${t.progress}%`;
      ev.onclick = () => openTaskModal(t.id);
      inner.appendChild(ev);
    });
    col.appendChild(inner);
    return col;
  }
  el.appendChild(buildCol('上午', 0, 12));
  el.appendChild(buildCol('下午 + 晚上', 12, 24));
}
function expandAllTree() { data.tasks.forEach(t => t.collapsed = false); save(); renderTreeByCategory(); }

function renderNode(task) {
  const li = document.createElement('li');
  const children = data.tasks.filter(t => t.parentId === task.id && t.status !== 'done' && !t.terminated);
  const c = colorForTask(task);

    <div class="value">${task.progress}%</div>
  `;
  const track = drag.querySelector('.track');
  const fill = drag.querySelector('.fill');
  const thumb = drag.querySelector('.thumb');
  const value = drag.querySelector('.value');
  let dragging = false;
  function updateFromEvent(e) {
    const rect = track.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;

    let p = Math.round(Math.max(0, Math.min(1, x / rect.width)) * 100);

  }

  function moveDrag(e) { if (!dragging) return; updateFromEvent(e); }

    const p = updateFromEvent(e.changedTouches ? { clientX: e.changedTouches[0].clientX } : e);
    openProgressModal(task.id, p);
  }
  drag.addEventListener('mousedown', startDrag);
  drag.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('mouseup', endDrag);

  };
  titleRow.appendChild(toggle); titleRow.appendChild(title); titleRow.appendChild(timingTag);
  titleRow.appendChild(drag); titleRow.appendChild(editBtn); titleRow.appendChild(doneBtn); titleRow.appendChild(stopBtn);
  body.appendChild(titleRow);
  const tl = document.createElement('div');
  tl.className = 'task-timeline';
  const tr = task.timeRange || { start: 9, end: 10 };
  tl.innerHTML = `
    <div class="bar" style="left:${(tr.start/24)*100}%;width:${((tr.end-tr.start)/24)*100}%;background:${c.bg}"></div>

    <div class="label">${String(tr.start).padStart(2,'0')}:00 - ${String(tr.end).padStart(2,'0')}:00</div>
  `;
  tl.onclick = () => openTaskModal(task.id);
  body.appendChild(tl);
  if (task.segments && task.segments.length) {
    const seg = document.createElement('div');
    seg.className = 'task-detail-text';
    seg.innerHTML = '分段：' + task.segments.map(s =>
      `<span style="display:inline-block;padding:2px 8px;border-radius:999px;background:${s.done?c.solid:'rgba(200,227,245,0.6)'};color:${s.done?'#fff':c.text};margin-right:4px;">${String(s.start).padStart(2,'0')}-${String(s.end).padStart(2,'0')}${s.done?' ✓':''}</span>`
    ).join('');
    body.appendChild(seg);
  }
  if (task.detail) {

    const days = task.timingType === '3d' ? 3 : (task.timingType === '7d' ? 7 : 0);
    const hours = tr.end - tr.start;
    const total = days ? hours * days : (task.totalHours || 0);
    const target = task.dailyTarget || getDailyTarget(task);

    body.appendChild(d);
  }
  node.appendChild(body);
  li.appendChild(node);
  if (children.length) {
    const ul = document.createElement('ul');
    ul.className = 'tree children' + (collapsed ? ' hidden' : '');
    children.forEach(c2 => ul.appendChild(renderNode(c2)));

function renderTodaySummary() {
  const today = todayStr();
  const yesterday = getYesterdayStr();
  const todayTasks = getTasksOnDate(today).filter(t => t.parentId === null && !t.terminated);
  let sumRatio = 0, doneCount = 0, overCount = 0;
  todayTasks.forEach(t => {
    const target = t.dailyTarget || getDailyTarget(t);
    const ratio = target > 0 ? Math.min(1, t.progress / target) : 0;
    sumRatio += ratio;
    if (t.progress >= target && t.progress > 0) doneCount++;
    if (t.progress > target) overCount++;
  });
  const todayRate = todayTasks.length ? Math.round(sumRatio / todayTasks.length * 100) : 0;
  const doneRate = todayTasks.length ? Math.round(doneCount / todayTasks.length * 100) : 0;
  let todayHours = 0;
  todayTasks.forEach(t => {
    const snap = getTaskDaily(t.id, today);
    if (snap && snap.hours) todayHours += snap.hours;
    else if (t.dailyHours && t.dailyHours[today]) todayHours += t.dailyHours[today];
  });
  const yTasks = getTasksOnDate(yesterday).filter(t => t.parentId === null && !t.terminated);
  let ySum = 0;
  yTasks.forEach(t => {
    const target = t.dailyTarget || getDailyTarget(t);
    const ratio = target > 0 ? Math.min(1, t.progress / target) : 0;
    ySum += ratio;
  });
  const yRate = yTasks.length ? Math.round(ySum / yTasks.length * 100) : 0;
  let yHours = 0;
  yTasks.forEach(t => {
    const snap = getTaskDaily(t.id, yesterday);
    if (snap && snap.hours) yHours += snap.hours;
    else if (t.dailyHours && t.dailyHours[yesterday]) yHours += t.dailyHours[yesterday];
  });
  const rateDelta = todayRate - yRate;
  const hoursDelta = todayHours - yHours;
  const rateText = rateDelta > 0 ? `+${rateDelta}%` : (rateDelta < 0 ? `${rateDelta}%` : '±0%');
  const hoursText = hoursDelta > 0 ? `+${hoursDelta.toFixed(1)}h` : (hoursDelta < 0 ? `${hoursDelta.toFixed(1)}h` : '±0h');
  const rateBox = document.getElementById('todayRateBox');
  if (rateBox) {
    rateBox.innerHTML = `
      <div class="today-rate-box">
        <div class="big-num">${todayRate}%</div>
        <div class="info">
          <div class="line1">今日完成率（按进度折算）</div>
          <div class="line2">达标率 ${doneRate}%（${doneCount}/${todayTasks.length}）${overCount ? ' · 超额 ' + overCount + ' 项' : ''}</div>
          <div class="line2">比昨日 <span class="${rateDelta>=0?'delta-up':'delta-down'}">${rateText}</span> · 今日完成 <span class="${hoursDelta>=0?'delta-up':'delta-down'}">${todayHours.toFixed(1)}h</span>（比昨日 ${hoursText}）</div>
          <div class="mood">${pickMood(todayRate >= 80 ? 'over' : todayRate >= 50 ? 'onTime' : 'partial')}</div>
        </div>
      </div>
    `;
  }
  const listEl = document.getElementById('todayTaskList');
  if (listEl) {
    listEl.innerHTML = '';
    if (!todayTasks.length) listEl.innerHTML = '<div class="empty">今天没有任务</div>';
    else {
      todayTasks.forEach(t => {
        const snap = getTaskDaily(t.id, today);
        const hours = (snap && snap.hours) || (t.dailyHours && t.dailyHours[today]) || 0;
        const target = t.dailyTarget || getDailyTarget(t);
        const level = snap && snap.finishLevel ? snap.finishLevel : autoFinishLevel(t.progress, target);
        const wrap = document.createElement('div');
        wrap.innerHTML = taskProgressLine(t, { level, hours, dateText: '' });
        listEl.appendChild(wrap);
      });
    }
  }
  const sugEl = document.getElementById('suggestions');
  if (sugEl) {
    const suggestions = [];
    if (todayTasks.length && todayRate < 100) suggestions.push(`今日完成率 ${todayRate}%，还有 ${todayTasks.length - doneCount} 项未达标，挑一项现在做 5 分钟试试`);
    if (!suggestions.length) suggestions.push('今天状态不错，继续保持');
    sugEl.innerHTML = suggestions.map(s => `<div class="log">${s}</div>`).join('');
  }
}
function getRangeDoneHours(startDate, endDate) {
  let hours = 0;
  const cur = new Date(startDate);
  const end = new Date(endDate);
  while (cur <= end) {
    const ds = formatDate(cur);
    const tasks = getTasksOnDate(ds).filter(t => t.parentId === null && !t.terminated);
    tasks.forEach(t => {
      const snap = getTaskDaily(t.id, ds);
      if (snap && snap.hours) hours += snap.hours;
      else if (t.dailyHours && t.dailyHours[ds]) hours += t.dailyHours[ds];
    });
    cur.setDate(cur.getDate() + 1);
  }
  return hours;
}
function renderHomeStats() {

  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  `;
}

/* ========== 桌面日历 ========== */
let calMode = 'month';
let calCursor = new Date();
let calSelected = todayStr();
function setCalMode(mode) {
  calMode = mode;
  ['month','week','day'].forEach(m => {
    const btn = document.getElementById('calMode' + m.charAt(0).toUpperCase() + m.slice(1));
    if (btn) {
      btn.style.background = (m === mode) ? 'var(--yellow-1)' : 'transparent';
      btn.style.color = 'var(--ink)';
      btn.style.borderColor = (m === mode) ? 'var(--yellow-1)' : 'var(--line)';
    }
  });
  renderCalendar(); renderDetailPanel();
}
function calPrev() {
  if (calMode === 'month') calCursor.setMonth(calCursor.getMonth() - 1);
  else if (calMode === 'week') calCursor.setDate(calCursor.getDate() - 7);
  else calCursor.setDate(calCursor.getDate() - 1);
  renderCalendar(); renderDetailPanel();
}
function calNext() {
  if (calMode === 'month') calCursor.setMonth(calCursor.getMonth() + 1);
  else if (calMode === 'week') calCursor.setDate(calCursor.getDate() + 7);
  else calCursor.setDate(calCursor.getDate() + 1);
  renderCalendar(); renderDetailPanel();
}
function calToday() {
  calCursor = new Date(); calSelected = todayStr();
  renderCalendar(); renderDetailPanel();
}
function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const title = document.getElementById('calTitle');
  if (!grid || !title) return;
  grid.innerHTML = '';
  if (calMode === 'month') {
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    title.textContent = `${y}年${m+1}月`;
    const firstDay = new Date(y, m, 1);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const prevMonthDays = new Date(y, m, 0).getDate();
    for (let i = startWeekday - 1; i >= 0; i--) grid.appendChild(makeCell(new Date(y, m - 1, prevMonthDays - i), true));
    for (let d = 1; d <= daysInMonth; d++) grid.appendChild(makeCell(new Date(y, m, d), false));
    const total = grid.children.length;
    for (let i = 0; total + i < 42; i++) grid.appendChild(makeCell(new Date(y, m+1, i+1), true));
  } else if (calMode === 'week') {
    const d = new Date(calCursor);
    const day = (d.getDay() + 6) % 7;
    const monday = new Date(d);
    monday.setDate(d.getDate() - day);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    title.textContent = `${monday.getMonth()+1}月${monday.getDate()}日 - ${sunday.getMonth()+1}月${sunday.getDate()}日`;
    for (let i = 0; i < 7; i++) {
      const cur = new Date(monday);
      cur.setDate(monday.getDate() + i);
      grid.appendChild(makeCell(cur, false));
    }
  } else if (calMode === 'day') {
    const d = new Date(calCursor);
    title.textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    grid.appendChild(makeCell(d, false));
  }
}
function makeCell(dateObj, otherMonth) {
  const dateStr = formatDate(dateObj);
  const tasks = getTasksOnDate(dateStr).filter(t => t.parentId === null && !t.terminated);
  let doneCount = 0;
  tasks.forEach(t => {
    const target = t.dailyTarget || getDailyTarget(t);
    if (t.progress >= target && t.progress > 0) doneCount++;
  });
  const cell = document.createElement('div');
  cell.className = 'cal-cell';
  if (otherMonth) cell.classList.add('other-month');
  if (dateStr === todayStr()) cell.classList.add('today');
  if (dateStr === calSelected) cell.classList.add('selected');
  const shown = tasks.slice(0, 4);
  const moreCount = tasks.length - shown.length;
  cell.innerHTML = `
    <div class="cal-day">
      <span>${dateObj.getDate()}</span>
      <span class="rate">${tasks.length ? doneCount + '/' + tasks.length : ''}</span>
    </div>
    <div class="cal-tasks">
      ${shown.map(t => {
        const c = colorForTask(t);
        const target = t.dailyTarget || getDailyTarget(t);
        const level = autoFinishLevel(t.progress, target);
        const doneClass = (level === 'done' || level === 'over') ? 'done' : '';
        return `<div class="cal-task ${doneClass}" style="background:${c.bg};color:${c.text};" title="${t.title}">${t.title}</div>`;
      }).join('')}
      ${moreCount > 0 ? `<div class="cal-more">+${moreCount} 更多</div>` : ''}
    </div>
  `;
  cell.onclick = () => { calSelected = dateStr; renderCalendar(); renderDetailPanel(); };
  return cell;
}
function renderDetailPanel() {
  const titleEl = document.getElementById('detailTitle');
  const el = document.getElementById('dayDetail');
  if (!titleEl || !el) return;
  el.innerHTML = '';
  if (calMode === 'day') {
    titleEl.textContent = `${calSelected} 当天详情`;
    const tasks = getTasksOnDate(calSelected).filter(t => t.parentId === null && !t.terminated);
    if (!tasks.length) { el.innerHTML = '<div class="empty">这天没有任务</div>'; return; }
    tasks.forEach(t => {
      const snap = getTaskDaily(t.id, calSelected);
      const hours = (snap && snap.hours) || (t.dailyHours && t.dailyHours[calSelected]) || 0;
      const target = t.dailyTarget || getDailyTarget(t);
      const level = snap && snap.finishLevel ? snap.finishLevel : autoFinishLevel(t.progress, target);
      const wrap = document.createElement('div');
      wrap.innerHTML = taskProgressLine(t, { level, hours, dateText: '' });
      el.appendChild(wrap);
    });
    return;
  }
  let startDate, endDate, label;
  if (calMode === 'week') {
    const d = new Date(calSelected + 'T00:00:00');
    const day = (d.getDay() + 6) % 7;
    const monday = new Date(d);
    monday.setDate(d.getDate() - day);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    startDate = monday; endDate = sunday; label = '本周';
  } else {
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    startDate = new Date(y, m, 1);
    endDate = new Date(y, m+1, 0);
    label = '本月';
  }
  titleEl.textContent = `${label}总结（${formatDate(startDate)} ~ ${formatDate(endDate)}）`;
  const taskMap = new Map();
  const cur = new Date(startDate);
  while (cur <= endDate) {
    const ds = formatDate(cur);
    getTasksOnDate(ds).filter(t => t.parentId === null && !t.terminated).forEach(t => {
      if (!taskMap.has(t.id)) taskMap.set(t.id, { task: t, totalProgress: 0, totalHours: 0, doneDates: 0, totalDates: 0 });
      const item = taskMap.get(t.id);
      item.totalDates++;
      const snap = getTaskDaily(t.id, ds);
      const target = t.dailyTarget || getDailyTarget(t);
      const level = snap && snap.finishLevel ? snap.finishLevel : autoFinishLevel(t.progress, target);
      if (level === 'done' || level === 'over') item.doneDates++;
      item.totalProgress += Math.min(100, t.progress);
      const hours = (snap && snap.hours) || (t.dailyHours && t.dailyHours[ds]) || 0;
      item.totalHours += hours;
    });
    cur.setDate(cur.getDate() + 1);
  }
  const all = [...taskMap.values()];
  const totalCount = all.length;
  const doneTasks = all.filter(i => i.doneDates >= i.totalDates);
  const notDoneTasks = all.filter(i => i.doneDates < i.totalDates);
  const avgProgress = totalCount ? Math.round(all.reduce((s, i) => s + (i.totalProgress / i.totalDates), 0) / totalCount) : 0;
  const totalHours = all.reduce((s, i) => s + i.totalHours, 0);
  const summary = document.createElement('div');
  summary.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;';
  summary.innerHTML = `
    <div style="padding:12px;border-radius:12px;background:rgba(131,183,225,0.15);text-align:center;">
      <div style="font-size:22px;font-weight:900;color:var(--blue-deep);">${totalCount}</div>
      <div style="font-size:11px;color:var(--muted);">任务总数</div>
    </div>
    <div style="padding:12px;border-radius:12px;background:rgba(252,231,110,0.35);text-align:center;">
      <div style="font-size:22px;font-weight:900;color:#6b5a1a;">${doneTasks.length}</div>
      <div style="font-size:11px;color:var(--muted);">顺利完成</div>
    </div>
    <div style="padding:12px;border-radius:12px;background:rgba(255,235,238,0.6);text-align:center;">
      <div style="font-size:22px;font-weight:900;color:#c62828;">${notDoneTasks.length}</div>
      <div style="font-size:11px;color:var(--muted);">未完成</div>
    </div>
    <div style="padding:12px;border-radius:12px;background:rgba(200,227,245,0.5);text-align:center;">
      <div style="font-size:22px;font-weight:900;color:var(--blue-deep);">${avgProgress}%</div>
      <div style="font-size:11px;color:var(--muted);">平均进度 · ${totalHours.toFixed(1)}h</div>
    </div>
  `;
  el.appendChild(summary);
  const dt = document.createElement('div');
  dt.style.cssText = 'font-size:13px;font-weight:800;margin:14px 0 8px;';
  dt.textContent = '任务详情';
  el.appendChild(dt);
  if (!all.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '这个周期内没有任务';
    el.appendChild(empty);
    return;
  }
  all.forEach(item => {
    const t = item.task;
    const c = colorForTask(t);
    const avg = Math.round(item.totalProgress / item.totalDates);
    const isDone = item.doneDates >= item.totalDates;
    const wrap = document.createElement('div');
    wrap.innerHTML = taskProgressLine(t, {
      level: isDone ? 'done' : 'partial',
      hours: item.totalHours,
      dateText: `出现 ${item.totalDates} 天 · 完成 ${item.doneDates} 天`
    });
    const bar = wrap.querySelector('.tpl-bar-fill');
    if (bar) bar.style.width = avg + '%';
    const bottom = wrap.querySelector('.tpl-bottom');
    if (bottom) bottom.innerHTML = `
      <span style="color:${isDone ? c.text : '#c62828'};font-weight:800;">平均 ${avg}%</span>
      <span style="color:var(--muted);">出现 ${item.totalDates} 天 · 完成 ${item.doneDates} 天</span>
    `;
    el.appendChild(wrap.firstElementChild || wrap);
  });
}

/* ========== 操作 ========== */
function toggleTask(id) {
  const t = data.tasks.find(x => x.id === id);
  if (!t) return;
  if (t.status === 'done') {
    t.status = 'doing'; t.progress = Math.max(0, t.progress - 100);
    t.doneAt = null; t.completedAt = null;
  } else {
    openProgressModal(t.id, t.progress); return;
  }
  recalcParents(); save(); renderAll();
}
function recalcParents() {
  const parents = [...new Set(data.tasks.filter(t => t.parentId).map(t => t.parentId))];
  parents.forEach(pid => {
    const children = data.tasks.filter(t => t.parentId === pid);
    if (!children.length) return;
    const avg = children.reduce((s,c) => s + c.progress, 0) / children.length;
    const p = data.tasks.find(t => t.id === pid);
    if (p) {
      p.progress = Math.round(avg);
      p.status = p.progress >= 100 ? 'done' : 'doing';
      if (p.status === 'done' && !p.doneAt) { p.doneAt = new Date().toLocaleString(); p.completedAt = p.doneAt; }
    }
  });
}
function renderBanner() {
  const slides = document.getElementById('slides');
  const dots = document.getElementById('bannerDots');
  if (!slides || !dots) return;
  slides.innerHTML = ''; dots.innerHTML = '';
  const imgs = (data.bannerImages && data.bannerImages.length) ? data.bannerImages : ['default'];
  imgs.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'slide';
    if (src === 'default') d.style.background = 'linear-gradient(135deg, #83B7E1 0%, #C8E3F5 50%, #FCE76E 100%)';
    else d.style.backgroundImage = `url('${src}')`;
    slides.appendChild(d);
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === bannerIndex ? ' active' : '');
    dot.onclick = () => { bannerIndex = i; updateBannerTransform(); renderBanner(); };
    dots.appendChild(dot);
  });
  updateBannerTransform();
  if (bannerTimer) clearInterval(bannerTimer);
  if (imgs.length > 1) {
    bannerTimer = setInterval(() => {
      bannerIndex = (bannerIndex + 1) % imgs.length;
      updateBannerTransform(); renderBanner();
    }, 4000);
  }
}
let bannerIndex = 0;
let bannerTimer = null;
function updateBannerTransform() {
  const el = document.getElementById('slides');
  if (el) el.style.transform = `translateX(-${bannerIndex * 100}%)`;
}
document.getElementById('workbenchTitle').addEventListener('input', (e) => {
  data.workbenchTitle = e.target.value || '我的工作台'; save();
});
document.getElementById('bannerUpload').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for (const f of files) { const a = await fileToDataURL(f); data.bannerImages.push(a.data); }
  e.target.value = ''; save(); renderBanner(); toast('已添加轮播图');
});
function removeBannerImage() {
  if (!data.bannerImages.length) return;
  data.bannerImages.splice(bannerIndex, 1);
  bannerIndex = 0; save(); renderBanner(); toast('已删除当前轮播图');
}
function switchView(view) {
  document.querySelectorAll('.nav-item').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('.mobile-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + view);
  if (el) el.classList.add('active');
  if (view === 'today') { renderTimeline(); renderFocus(); renderTodaySummary(); }
  if (view === 'tree') { renderTreeByCategory(); renderDoneList(); }
  if (view === 'habits') { renderHabitSummary(); renderHabitWeekTable(); }
  if (view === 'calendar') {
    renderCalendar(); renderDetailPanel(); renderHomeStats();
    renderMobileCalendar();
  }
  if (view === 'logs') { renderLogs(); }
  if (view === 'all') { renderAll(); }
}

/* 总览：右侧竖排任务数和打卡，日历铺开不压缩 */
function renderOverview() {
  const map = [
    ['ovFocus', 'focus'],
    ['ovRate', 'todayRateBox'],
    ['ovTimeline', 'timelineBlock'],
    ['ovCal', 'calGrid']
  ];
  map.forEach(([target, source]) => {
    const t = document.getElementById(target);
    const s = document.getElementById(source);
    if (t && s) t.innerHTML = s.innerHTML;
  });
  // 总览右侧：任务数统计
  const ovStats = document.getElementById('ovStats');
  if (ovStats) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    let totalTasks = 0, doneTasks = 0, notDone = 0;
    const cur = new Date(y, m, 1);
    const end = new Date(y, m+1, 0);
    while (cur <= end) {
      const ds = formatDate(cur);
      getTasksOnDate(ds).filter(t => t.parentId === null && !t.terminated).forEach(t => {
        totalTasks++;
        const target = t.dailyTarget || getDailyTarget(t);
        const level = autoFinishLevel(t.progress, target);
        if (level === 'done' || level === 'over') doneTasks++;
        else notDone++;
      });
      cur.setDate(cur.getDate() + 1);
    }
    ovStats.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="padding:12px;border-radius:12px;background:rgba(131,183,225,0.15);text-align:center;">
          <div style="font-size:22px;font-weight:900;color:var(--blue-deep);">${totalTasks}</div>
          <div style="font-size:11px;color:var(--muted);">本月任务总数</div>
        </div>
        <div style="padding:12px;border-radius:12px;background:rgba(252,231,110,0.35);text-align:center;">
          <div style="font-size:22px;font-weight:900;color:#6b5a1a;">${doneTasks}</div>
          <div style="font-size:11px;color:var(--muted);">已完成</div>
        </div>
        <div style="padding:12px;border-radius:12px;background:rgba(255,235,238,0.6);text-align:center;">
          <div style="font-size:22px;font-weight:900;color:#c62828;">${notDone}</div>
          <div style="font-size:11px;color:var(--muted);">未完成</div>
        </div>
        <div style="padding:12px;border-radius:12px;background:rgba(200,227,245,0.5);text-align:center;">
          <div style="font-size:22px;font-weight:900;color:var(--blue-deep);">${totalTasks ? Math.round(doneTasks/totalTasks*100) : 0}%</div>
          <div style="font-size:11px;color:var(--muted);">完成率</div>
        </div>
      </div>
    `;
  }
  const habitEl = document.getElementById('ovHabits');
  if (habitEl) {
    habitEl.innerHTML = (document.getElementById('habitSummary')?.innerHTML || '') +
                        (document.getElementById('habitWeekTable')?.innerHTML || '');
  }
  // 总览里的卡片可点击
  setTimeout(() => {
    document.querySelectorAll('#ovTimeline .timeline-event').forEach(ev => {
      const title = ev.textContent.split(' ')[0];
      ev.onclick = () => {
        const t = data.tasks.find(x => x.title === title);
        if (t) openTaskModal(t.id);
      };
    });
    document.querySelectorAll('#ovTree .title, #ovTree .tpl-name').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const title = el.textContent.trim().replace(/\s*\(周期\)|\s*\(顺延.*?\)/g, '');
        const t = data.tasks.find(x => x.title === title);
        if (t) openTaskModal(t.id);
      };
    });
  }, 50);
}
function renderAll() {
  applyAutoRoll();
  renderBanner();
  renderTimeline();
  renderTreeByCategory();
  renderDoneList();
  renderFocus();
  renderTodaySummary();
  renderHomeStats();
  renderHabitSummary();
  renderHabitWeekTable();
  renderLogs();
  renderCalendar();
  renderDetailPanel();
  renderMobileCalendar();
  renderOverview();
  const wt = document.getElementById('workbenchTitle');
  if (wt) wt.value = data.workbenchTitle || '我的工作台';
}
window.addEventListener('DOMContentLoaded', () => {
  renderDate();
  initAuth();
});
let lastW = window.innerWidth;
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  if ((lastW <= 1000 && w > 1000) || (lastW > 1000 && w <= 1000)) renderAll();
  lastW = w;
});
</script>
